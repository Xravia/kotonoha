<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Kotonoha · music video</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } #p { width: 100%; height: 100%; }</style>
</head>
<body>
<div id="p"></div>
<script>
/* Kotonoha's video relay. The copy of the game opened from disk cannot show YouTube videos itself (YouTube wants to
   know the page that asks), so it puts this page in a frame and drives the player here with messages: play, pause,
   seek, speed, volume. This page only answers its own parent frame and only runs a YouTube player. */
'use strict';
(function () {
  var q = new URLSearchParams(location.hash.slice(1)), vid = q.get('v') || '', start = Number(q.get('s')) || 0;
  var up = window.parent, player = null, ready = false, timer = 0;
  if (!/^[\w-]{11}$/.test(vid) || up === window) return;
  function send(o) { o.kt = 'yt'; try { up.postMessage(o, '*'); } catch (e) {} }
  function t() { try { return player.getCurrentTime() || 0; } catch (e) { return 0; } }
  function d() { try { return player.getDuration() || 0; } catch (e) { return 0; } }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      videoId: vid, width: '100%', height: '100%',
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0, disablekb: 1, iv_load_policy: 3, fs: 0, cc_load_policy: 0, start: Math.floor(start), origin: location.origin },
      events: {
        onReady: function () { ready = true; var r = [1]; try { r = player.getAvailablePlaybackRates() || [1]; } catch (e) {} send({ ev: 'ready', t: t(), d: d(), rates: r }); },
        onStateChange: function (e) {
          clearInterval(timer);
          if (e.data === 1) timer = setInterval(function () { send({ ev: 'time', t: t(), d: d() }); }, 100);
          send({ ev: 'state', s: e.data, t: t(), d: d() });
        },
        onError: function (e) { send({ ev: 'error', code: e.data }); },
        onPlaybackRateChange: function (e) { send({ ev: 'rate', r: e.data, t: t() }); }
      }
    });
  };
  window.addEventListener('message', function (e) {
    if (e.source !== up) return;
    var m = e.data;
    if (!m || m.kt !== 'yt' || !m.cmd || !player || !ready) return;
    try {
      if (m.cmd === 'play') player.playVideo();
      else if (m.cmd === 'pause') player.pauseVideo();
      else if (m.cmd === 'seek') { player.seekTo(Number(m.t) || 0, true); send({ ev: 'time', t: Number(m.t) || 0, d: d() }); }
      else if (m.cmd === 'rate') player.setPlaybackRate(Number(m.r) || 1);
      else if (m.cmd === 'vol') player.setVolume(Math.max(0, Math.min(100, Number(m.v) || 0)));
      else if (m.cmd === 'cue' && /^[\w-]{11}$/.test(m.v)) player.cueVideoById({ videoId: m.v, startSeconds: Number(m.s) || 0 });
    } catch (err) {}
  });
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
  s.onerror = function () { send({ ev: 'error', code: 'api' }); };
  document.head.appendChild(s);
  send({ ev: 'hello' });
})();
</script>
</body>
</html>
